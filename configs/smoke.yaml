# Run nhỏ chỉ để kiểm tra đường đi kỹ thuật (spec §8). KHÔNG dùng số của smoke làm kết quả nghiên cứu.
# Giữ nguyên schema/cohort/split của baseline; chỉ giảm: dimensions, walks_per_node, epochs, n_estimators.
project:
  output_root: outputs
data:
  root: dataset
  files:
    bug: TIeventlogBug.csv
    story: TIeventlogStory.csv
  recursive_discovery: true
  cohort: bug
  reference_counts:
    bug: {events: 5126, issues: 161}
    story: {events: 4439, issues: 182}
preprocess:
  actions_file: configs/actions.yaml
  view: core
  terminal_statuses: [DONE, Rejected]
  noise_policy: drop_generic_external_link_updates
split:
  seed: 42
  train_fraction: 0.60
  validation_fraction: 0.20
  test_fraction: 0.20
  stratify: terminal_status
graph:
  directed: true
  encoding: activity
  add_boundaries: true
  transition_alpha: 1.0
walk:
  p: 1.0
  q: 1.0
  length: 20
  walks_per_node: 5        # baseline: 50
embedding:
  dimensions: 8            # baseline: 16
  window: 3
  epochs: 2                # baseline: 20
  negative: 5
  min_count: 1
  sample: 0.0
  workers: 1
features:
  methods: [A_stats, B_ngrams, C_embedding, D_hybrid]
  include_time: false
detector:
  n_estimators: 20         # baseline: 200
  max_samples: auto
  contamination: auto
  n_jobs: 1
mutation:
  types: [swap_adjacent, delete_internal, duplicate_block]
  max_per_type_per_parent: 1
  validation_seed: 1042
  test_seed: 2042
  duplicate_block_max_length: 2
run:
  seed: 42
  fail_on_existing_output: true
notebooks:
  timeout_seconds: 180
